<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>היום שלי</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6f5e">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f2f6f3;--card:#fff;--ink:#1c2420;--mute:#66736c;--accent:#2f8f6f;--line:#dfe8e2;--done:#9aaba2;--danger:#b4412f;--h1:#2f7a62;--h2:#4aa386;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--card:#1b2220;--ink:#e8efeb;--mute:#97a69e;--accent:#5fc3a1;--line:#2a3430;--done:#66766e;--danger:#e0735f;--h1:#1f4a3f;--h2:#2d6b58;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121715;--card:#1b2220;--ink:#e8efeb;--mute:#97a69e;--accent:#5fc3a1;--line:#2a3430;--done:#66766e;--danger:#e0735f;--h1:#1f4a3f;--h2:#2d6b58;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px}
main{max-width:560px;margin:0 auto;padding:16px 16px 110px}
.hero{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;border-radius:24px;padding:24px 22px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
h1{margin:0;font-size:32px;font-weight:800;letter-spacing:-.5px}
.sub{margin-top:6px;color:rgba(255,255,255,.88);font-size:16px}
.tabs{display:flex;gap:4px;margin:16px 0 6px;background:var(--line);padding:4px;border-radius:14px}
.tab{flex:1;padding:10px;border-radius:10px;border:none;background:none;color:var(--mute);font:inherit;cursor:pointer}
.tab.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.12)}
h2{font-size:15px;margin:30px 0 8px;color:var(--mute);font-weight:700}
h2.sec{margin:22px 4px 6px;font-size:14px;letter-spacing:.3px}
.task{display:flex;align-items:center;gap:16px;width:100%;background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:16px 4px;font:inherit;color:inherit;text-align:start;cursor:pointer}
.box{flex:none;width:30px;height:30px;border:2px solid var(--accent);border-radius:50%;display:grid;place-items:center;color:transparent;font-size:17px;font-weight:700;transition:background .15s,transform .15s}
.task:active .box{transform:scale(.88)}
.task.done .box{background:var(--accent);color:var(--bg);animation:pop .25s}
@keyframes pop{50%{transform:scale(1.2)}}
.task .name{font-size:18px}
.task.done .name{color:var(--done);text-decoration:line-through}
.empty{color:var(--mute);text-align:center;padding:30px 0}
.empty.sm{padding:12px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
.row small{display:block;color:var(--mute);margin-top:2px}
.del{background:none;border:none;color:var(--danger);font:inherit;cursor:pointer;padding:6px 8px}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--bg);border:none;border-radius:30px;padding:16px 24px;font:inherit;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.28);cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:22px 16px calc(20px + env(safe-area-inset-bottom,0px))}
input[type=text]{width:100%;font:inherit;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{border:1px solid var(--accent);background:none;color:var(--ink);border-radius:20px;padding:8px 14px;font:inherit;cursor:pointer}
.chip.on{background:var(--accent);color:var(--bg)}
.btns{display:flex;gap:10px;margin-top:6px}
.btns button{flex:1;padding:14px;border-radius:14px;border:1px solid var(--line);font:inherit;cursor:pointer;background:none;color:var(--ink)}
.btns .ok{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0}
.wk button{padding:13px 0;border-radius:14px;border:none;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.wk button.on{background:var(--accent);color:var(--bg);font-weight:700}
.wk button.today{outline:2px solid var(--accent);outline-offset:2px}
.mini{background:none;border:1px solid var(--accent);color:var(--ink);border-radius:10px;padding:6px 12px;font:inherit;cursor:pointer}
.mini.rm{border-color:var(--danger);color:var(--danger)}
.task .name{display:block}
.txt{display:block}
.tm{display:block;font-size:14px;color:var(--mute);margin-top:3px}
.tm.soon{color:#d98a1f;font-weight:700}
.tm.over{color:var(--danger);font-weight:700}
.task.soon .box{border-color:#d98a1f}
.task.over .box{border-color:var(--danger)}
.task.later{opacity:.42}
.times{display:flex;gap:10px;margin:14px 0 6px}
.times label{flex:1;font-size:14px;color:var(--mute)}
.times input{width:100%;font:inherit;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:4px}
.tsel{display:flex;align-items:center;gap:4px;margin-top:4px}
.tsel select{flex:1;min-width:0;font:inherit;padding:11px 4px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.tsel b{color:var(--mute)}
.hint{font-size:13px;color:var(--mute);margin-bottom:12px}
</style>
</head>
<body>
<main>
  <header class="hero">
    <h1 id="wd"></h1>
    <div class="sub" id="dates"></div>
  </header>
  <div class="tabs"><button class="tab on" data-v="today">היום</button><button class="tab" data-v="week">עריכה שבועית</button></div>
  <section id="v-today">
    <div id="list"></div>
    <h2>כל המשימות הקבועות</h2>
    <div id="manage"></div>
  </section>
  <section id="v-week" hidden>
    <div class="wk" id="wk"></div>
    <h2 class="sec" id="wk-title"></h2>
    <div id="wk-in"></div>
    <h2 class="sec">משימות שלא ביום הזה</h2>
    <div id="wk-out"></div>
  </section>
</main>
<button class="fab" id="add">+ משימה</button>

<div class="ov" id="ov">
  <div class="sheet">
    <input type="text" id="nm" placeholder="שם המשימה (למשל: חברותא עם דוד)" maxlength="80">
    <div class="chips" id="chips"></div>
    <div class="times"><label>משעה<span class="tsel" dir="ltr"><select id="tsh"></select><b>:</b><select id="tsm"></select></span></label><label>עד שעה<span class="tsel" dir="ltr"><select id="teh"></select><b>:</b><select id="tem"></select></span></label></div>
    <div class="hint">אפשר להשאיר ריק: בלי שעות המשימה פתוחה כל היום</div>
    <div class="btns"><button id="cancel">ביטול</button><button class="ok" id="save">שמירה</button></div>
  </div>
</div>

<script>
const KEY = 'todayApp.v1';
const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
let state = { tasks: [], done: {} };

// --- שכבת אחסון: בשלב הבא אפשר להחליף רק את שתי הפונקציות האלה ---
function load(){ try{ const s = localStorage.getItem(KEY); if(s) state = JSON.parse(s); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

const pad = n => String(n).padStart(2,'0');
const dkey = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const daysLabel = t => !t.days.length ? 'ללא ימים' : t.days.length === 7 ? 'כל יום' : 'ימי ' + t.days.slice().sort().map(i => DAYS[i]).join(', ');

function tasksFor(d){ return state.tasks.filter(t => t.days.includes(d.getDay())); }

function render(){
  applyView();
  const now = new Date(), k = dkey(now);
  const done = state.done[k] || [];
  const todays = tasksFor(now);
  $('wd').textContent = 'יום ' + DAYS[now.getDay()];
  const heb = hebDate(now);
  $('dates').textContent = heb + ' · ' + now.toLocaleDateString('he-IL');
  const nowMin = now.getHours()*60 + now.getMinutes();
  const item = (t, mode) => {
    const d = done.includes(t.id);
    let tm = timeText(t) || 'כל היום';
    if(!d && mode === 'soon'){ const left = toMin(t.end) - nowMin; tm = left > 0 ? `נשארו ${left} דקות` : 'הדקה האחרונה'; }
    if(!d && mode === 'over') tm = `הזמן עבר (${t.end})`;
    const cls = d ? 'done' : mode;
    return `<button class="task ${cls}" data-id="${t.id}"><span class="box">✓</span><span class="txt"><span class="name">${esc(t.name)}</span>${tm ? `<small class="tm ${d?'':mode}">${tm}</small>` : ''}</span></button>`;
  };
  const rank = { over: 0, soon: 1, active: 2 };
  const modes = {};
  todays.forEach(t => { if(!done.includes(t.id)) modes[t.id] = statusOf(t, nowMin); });
  const todo = todays.filter(t => modes[t.id] && modes[t.id] !== 'later').sort((x,y) => rank[modes[x.id]] - rank[modes[y.id]]);
  const later = todays.filter(t => modes[t.id] === 'later');
  const fin = todays.filter(t => done.includes(t.id));
  if(!todays.length){
    $('list').innerHTML = '<div class="empty">אין משימות להיום.<br>לחץ על "+ משימה" כדי להוסיף.</div>';
  } else {
    $('list').innerHTML =
      `<h2 class="sec">לא הושלמו (${todo.length})</h2>` + (todo.length ? todo.map(t => item(t, modes[t.id])).join('') : `<div class="empty sm">${later.length ? 'אין משימות פעילות כרגע' : 'הכול הושלם 🎉'}</div>`) +
      (later.length ? `<h2 class="sec">עוד לא רלוונטי (${later.length})</h2>` + later.map(t => item(t, 'later')).join('') : '') +
      `<h2 class="sec">הושלמו (${fin.length})</h2>` + (fin.length ? fin.map(t => item(t, 'done')).join('') : '<div class="empty sm">עדיין לא סימנת כלום</div>');
  }
  $('manage').innerHTML = state.tasks.length ? state.tasks.map(t =>
    `<div class="row"><div>${esc(t.name)}<small>${metaLabel(t)}</small></div><button class="del" data-del="${t.id}">מחיקה</button></div>`
  ).join('') : '<div class="empty">עדיין אין משימות.</div>';
}

$('list').addEventListener('click', e => {
  const b = e.target.closest('.task'); if(!b) return;
  const k = dkey(new Date()), id = b.dataset.id;
  const arr = state.done[k] || (state.done[k] = []);
  const i = arr.indexOf(id);
  i >= 0 ? arr.splice(i,1) : arr.push(id);
  save(); render();
});

$('manage').addEventListener('click', e => {
  const id = e.target.dataset.del; if(!id) return;
  const t = state.tasks.find(x => x.id === id);
  if(!confirm('למחוק את "' + t.name + '"?')) return;
  state.tasks = state.tasks.filter(x => x.id !== id);
  save(); render();
});

// --- בחירת שעה בפורמט 24 שעות ---
['tsh','teh'].forEach(id => $(id).innerHTML = '<option value="">--</option>' + Array.from({length:24}, (_,i) => `<option>${pad(i)}</option>`).join(''));
['tsm','tem'].forEach(id => $(id).innerHTML = Array.from({length:60}, (_,i) => `<option>${pad(i)}</option>`).join(''));
const getT = (h,m) => $(h).value ? $(h).value + ':' + $(m).value : '';
const clearT = () => { ['tsh','teh'].forEach(i => $(i).value = ''); ['tsm','tem'].forEach(i => $(i).value = '00'); };

// --- הוספת משימה ---
let sel = new Set([0,1,2,3,4,5,6]);
function drawChips(){
  const all = sel.size === 7;
  $('chips').innerHTML = `<button class="chip ${all?'on':''}" data-all="1">כל יום</button>` +
    DAYS.map((n,i) => `<button class="chip ${!all && sel.has(i)?'on':''}" data-d="${i}">${n}</button>`).join('');
}
$('chips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if(!c) return;
  if(c.dataset.all){ sel = new Set([0,1,2,3,4,5,6]); }
  else {
    if(sel.size === 7) sel = new Set();   // יציאה ממצב "כל יום" לבחירה ידנית
    const i = +c.dataset.d;
    sel.has(i) ? sel.delete(i) : sel.add(i);
  }
  drawChips();
});
$('add').onclick = () => { $('nm').value = ''; clearT(); sel = view === 'week' ? new Set([wkDay]) : new Set([0,1,2,3,4,5,6]); drawChips(); $('ov').classList.add('on'); $('nm').focus(); };
$('cancel').onclick = () => $('ov').classList.remove('on');
$('save').onclick = () => {
  const name = $('nm').value.trim();
  if(!name){ $('nm').focus(); return; }
  if(!sel.size){ alert('בחר לפחות יום אחד'); return; }
  const ts = getT('tsh','tsm'), te = getT('teh','tem');
  if(ts && te && te <= ts){ alert('שעת הסיום חייבת להיות אחרי שעת ההתחלה'); return; }
  state.tasks.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), name, days: [...sel].sort(), start: ts, end: te });
  save(); $('ov').classList.remove('on'); render();
};

// --- שעות למשימות ---
const toMin = h => { const [a,b] = h.split(':'); return (+a)*60 + (+b); };
const timeText = t => t.start && t.end ? `${t.start} עד ${t.end}` : t.start ? 'מ-' + t.start : t.end ? 'עד ' + t.end : '';
const metaLabel = t => daysLabel(t) + (timeText(t) ? ' · ' + timeText(t) : '');
function statusOf(t, nowMin){
  if(nowMin < toMin(t.start || '00:00')) return 'later';
  if(t.end){ const left = toMin(t.end) - nowMin; if(left < 0) return 'over'; if(left <= 30) return 'soon'; }
  return 'active';
}

// --- תאריך עברי באותיות: ד׳ חשוון התשפ״ז ---
const GEM = [[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק'],[90,'צ'],[80,'פ'],[70,'ע'],[60,'ס'],[50,'נ'],[40,'מ'],[30,'ל'],[20,'כ'],[10,'י'],[9,'ט'],[8,'ח'],[7,'ז'],[6,'ו'],[5,'ה'],[4,'ד'],[3,'ג'],[2,'ב'],[1,'א']];
function gem(n){
  let s = '';
  for(const [v,c] of GEM){
    while(n >= v){
      if(v === 10 && (n === 15 || n === 16)){ s += n === 15 ? 'טו' : 'טז'; n = 0; break; }
      s += c; n -= v;
    }
  }
  return s.length > 1 ? s.slice(0,-1) + '״' + s.slice(-1) : s + '׳';
}
function hebDate(d){
  try{
    const f = new Intl.DateTimeFormat('he-u-ca-hebrew',{day:'numeric',month:'long',year:'numeric'});
    const p = f.formatToParts(d), g = t => (p.find(x => x.type === t) || {}).value;
    const day = parseInt(g('day'),10), yr = parseInt(g('year'),10);
    if(!day || !yr || !g('month')) return f.format(d);
    return gem(day) + ' ' + g('month') + ' ה' + gem(yr % 1000);
  }catch(e){ return ''; }
}

// --- תצוגות: היום / עריכה שבועית ---
const LET = 'אבגדהוש';
let view = 'today', wkDay = new Date().getDay();
function applyView(){
  $('v-today').hidden = view !== 'today';
  $('v-week').hidden = view !== 'week';
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  $('add').textContent = view === 'week' ? '+ משימה חדשה' : '+ משימה';
  if(view === 'week') renderWeek();
}
function renderWeek(){
  const td = new Date().getDay();
  $('wk').innerHTML = DAYS.map((n,i) => `<button class="${i===wkDay?'on':''} ${i===td?'today':''}" data-d="${i}">${LET[i]}׳</button>`).join('');
  $('wk-title').textContent = 'יום ' + DAYS[wkDay];
  const inn = state.tasks.filter(t => t.days.includes(wkDay));
  const out = state.tasks.filter(t => !t.days.includes(wkDay));
  $('wk-in').innerHTML = inn.length ? inn.map(t =>
    `<div class="row"><div>${esc(t.name)}<small>${metaLabel(t)}</small></div><button class="mini rm" data-rm="${t.id}">הסר</button></div>`
  ).join('') : '<div class="empty sm">אין משימות ביום הזה</div>';
  $('wk-out').innerHTML = out.length ? out.map(t =>
    `<div class="row"><div>${esc(t.name)}<small>${metaLabel(t)}</small></div><button class="mini" data-ad="${t.id}">הוסף ליום</button></div>`
  ).join('') : '<div class="empty sm">כל המשימות כבר ביום הזה</div>';
}
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if(!b) return;
  view = b.dataset.v; render();
});
$('wk').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  wkDay = +b.dataset.d; render();
});
$('v-week').addEventListener('click', e => {
  const rm = e.target.dataset.rm, ad = e.target.dataset.ad;
  const t = state.tasks.find(x => x.id === (rm || ad)); if(!t) return;
  t.days = rm ? t.days.filter(d => d !== wkDay) : [...t.days, wkDay].sort();
  save(); render();
});

document.addEventListener('visibilitychange', () => { if(!document.hidden) render(); });
load(); render();
setInterval(() => { if(!document.hidden) render(); }, 30000);
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
